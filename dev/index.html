<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dot | Links</title>
    <style>
      :root {
        --bg: #0b0b0d;
        --text: #f5f5f5;
        --muted: #b3b3b8;
        --link: #c8dcff;
        --line: #252529;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        padding: 24px 16px 34px;
      }
      .container {
        width: min(100%, 760px);
        margin: 0 auto;
      }
      .line {
        margin: 0 0 18px;
        font-size: 36px;
        line-height: 1.16;
        letter-spacing: -0.02em;
        font-weight: 500;
      }
      .line.small {
        font-size: 30px;
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 999px;
        object-fit: cover;
        vertical-align: middle;
        margin-left: 10px;
      }
      .icons {
        display: inline-flex;
        gap: 8px;
        margin-left: 10px;
        vertical-align: middle;
      }
      .app-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        object-fit: cover;
      }
      .app-link {
        display: inline-flex;
        border-radius: 14px;
      }
      .app-link:hover { opacity: 0.9; }
      .social {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        text-decoration: none;
        font-size: 21px;
        font-weight: 700;
      }
      .x { background: #101010; }
      .ig { background: linear-gradient(135deg, #f59e0b, #ec4899, #6366f1); }
      .gh { background: #1f2937; }
      .is { background: #7c3aed; }
      a.link {
        color: var(--link);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .links-list {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px dashed var(--line);
      }
      .links-list p {
        margin: 0 0 11px;
        font-size: 18px;
        color: var(--muted);
      }
      @media (max-width: 680px) {
        .line { font-size: 24px; line-height: 1.22; }
        .line.small { font-size: 22px; }
        .avatar { width: 40px; height: 40px; margin-left: 8px; }
        .app-icon { width: 42px; height: 42px; border-radius: 11px; }
        .social { width: 40px; height: 40px; border-radius: 11px; font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <p class="line">Hi, my name is Dot<img class="avatar" src="https://www.google.com/s2/favicons?domain=github.com&sz=128" alt="Dot avatar" /></p>

      <p class="line">I build apps
        <span class="icons">
          <a class="app-link" href="https://play.google.com/store/apps/details?id=com.dotsystemsdevs.mulligan" target="_blank" rel="noopener"><img class="app-icon" src="https://play-lh.googleusercontent.com/90HZ8Qd30HWYO9kqhhZ7oj5e-XZ0iF1Nm3s21fQZV5GtHkklBsYQOk3rdzN2HWjOBR2-HSihb5ce3rGuCUDwebw" alt="Mulligan icon" /></a>
          <a class="app-link" href="https://play.google.com/store/apps/details?id=com.dotsystems.slothy" target="_blank" rel="noopener"><img class="app-icon" src="https://play-lh.googleusercontent.com/qffjij_L_BXMw2F_fHw4tkwnc3rz4CYQKxPZ6jzzAOnlmdVAYUA6n3gGMSmxSNr_0VAIcwMp8opSz6FH9OA7KE0" alt="Slothy icon" /></a>
          <a class="app-link" href="https://apps.apple.com/app/id6759191239" target="_blank" rel="noopener"><img class="app-icon" src="https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/ee/d9/6b/eed96b3a-24f7-cba9-1298-69cf35671a85/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg" alt="Bogey Blamer icon" /></a>
        </span>
      </p>

      <p class="line">and build on the web</p>

      <p class="line">Build2Race -
        <a class="link" href="https://build2race.com" target="_blank" rel="noopener">Your triathlon training plan</a>
      </p>

      <p class="line">I also post regularly on these platforms
        <span class="icons">
          <a class="social x" href="https://x.com/dotsystemsdevs" target="_blank" rel="noopener">X</a>
          <a class="social ig" href="https://www.instagram.com/dotsystemsdevs/#" target="_blank" rel="noopener">IG</a>
          <a class="social gh" href="https://github.com/dotsystemsdevs" target="_blank" rel="noopener">GH</a>
          <a class="social is" href="https://github.com/dotsystemsdevs/pages/issues" target="_blank" rel="noopener">IS</a>
        </span>
      </p>

      <p class="line small">Curious about my stack? <a class="link" href="https://github.com/dotsystemsdevs" target="_blank" rel="noopener">Click here.</a></p>

      <section class="links-list">
        <p><a class="link" href="https://play.google.com/store/apps/details?id=com.dotsystemsdevs.mulligan" target="_blank" rel="noopener">Mulligan (Android)</a></p>
        <p><a class="link" href="https://play.google.com/store/apps/details?id=com.dotsystems.slothy" target="_blank" rel="noopener">Slothy (Android)</a> · <a class="link" href="https://apps.apple.com/app/id6760565326" target="_blank" rel="noopener">Slothy (iOS)</a></p>
        <p><a class="link" href="https://apps.apple.com/app/id6759191239" target="_blank" rel="noopener">Bogey Blamer (iOS)</a></p>
        <p><a class="link" href="https://commitmentissues.dev" target="_blank" rel="noopener">commitmentissues.dev</a></p>
      </section>
    </main>
  </body>
</html>
